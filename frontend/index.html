<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      try{document.documentElement.dataset.mode=localStorage.getItem('atha-mode')||'night'}catch(e){document.documentElement.dataset.mode='night'}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/atha-star.png" />

      content="ATHA is a living laboratory for AI-native management education, run by OneMundi with Warwick Business School. Real companies bring real decisions; Executive MBA teams work them across a multi-day experience."

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap"

      <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap"
        rel="stylesheet"
      />
